name: AI module CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Bytecode check
        run: python -m compileall -q ai_module tests
      - name: Build CPU-only and optional GPU variants
        timeout-minutes: 15
        run: |
          docker build --target cpu -t home-ai-core-ai:cpu-test .
          docker build --target gpu -t home-ai-core-ai:gpu-test .
          docker run --rm --entrypoint /usr/local/bin/ollama home-ai-core-ai:cpu-test --version
          CPU_BYTES="$(docker image inspect home-ai-core-ai:cpu-test --format '{{.Size}}')"
          GPU_BYTES="$(docker image inspect home-ai-core-ai:gpu-test --format '{{.Size}}')"
          echo "CPU image bytes: $CPU_BYTES"
          echo "GPU image bytes: $GPU_BYTES"
          test "$CPU_BYTES" -lt 1250000000
          test "$GPU_BYTES" -gt "$((CPU_BYTES + 1000000000))"
      - name: Smoke test CPU-only startup with Core Docker restrictions
        timeout-minutes: 6
        run: bash scripts/smoke_local_runtime.sh home-ai-core-ai:cpu-test
