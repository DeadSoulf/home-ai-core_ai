name: AI module CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Bytecode check
        run: python -m compileall -q ai_module tests
      - name: Docker build
        run: |
          docker build -t home-ai-core-ai:test .
          docker run --rm --entrypoint /usr/local/bin/ollama home-ai-core-ai:test --version
      - name: Bundled Ollama rootless runtime smoke
        timeout-minutes: 6
        run: bash scripts/smoke_local_runtime.sh home-ai-core-ai:test
