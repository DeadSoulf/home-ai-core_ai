# Standalone DEVELOPMENT mode only. Core Module SDK v2 installs the image itself.
services:
  ai:
    build: .
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      AI_DATA_DIR: /data
      AI_HOST: 0.0.0.0
      AI_PORT: 8080
    volumes:
      - ai-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  ai-data: {}
